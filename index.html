<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>Ночная оборона</title>
<link rel="stylesheet" href="css/style.css?v=16">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Заглушка для ландшафтной ориентации -->
<div id="rotate-blocker">
  <div class="rotate-icon"></div>
  <p>Поверни устройство вертикально</p>
</div>

<div id="app">

  <!-- ЭКРАН: главное меню -->
  <section id="screen-menu" class="screen active">
    <div class="menu-inner">
      <div class="menu-mark"><canvas id="menu-mark-canvas" width="120" height="120"></canvas></div>
      <h1 class="title">Ночная оборона</h1>
      <p class="subtitle">Last Row</p>
      <div class="menu-buttons">
        <button class="btn primary" id="btn-play">Играть</button>
        <button class="btn" id="btn-levels">Планеты</button>
        <button class="btn" id="btn-codex">Справочник</button>
        <button class="btn toggle" id="btn-dev">
          <span>Dev mode</span><i class="switch"></i>
        </button>
        <button class="btn" id="btn-endless" hidden>Бесконечные волны</button>
      </div>
      <p class="menu-note" id="menu-note"></p>
      <button class="btn ghost small" id="btn-reset">Сбросить прогресс</button>
    </div>
  </section>

  <!-- ЭКРАН: планеты и уровни -->
  <section id="screen-levels" class="screen">
    <header class="sub-head">
      <button class="icon-btn" id="btn-levels-back" aria-label="назад">&#8592;</button>
      <span id="levels-title">Планеты</span>
    </header>

    <div id="planet-view" class="planet-view">
      <div id="acts"></div>
    </div>

    <div id="level-list" class="level-list hidden"></div>
  </section>

  <!-- ЭКРАН: справочник по защитникам -->
  <section id="screen-codex" class="screen">
    <header class="sub-head">
      <button class="icon-btn" id="btn-codex-back" aria-label="назад">&#8592;</button>
      <span>Справочник</span>
    </header>
    <div id="codex-list" class="codex-list"></div>
  </section>

  <!-- ЭКРАН: игра -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="hud-sparks" id="hud-sparks">
        <i class="spark-dot"></i><span id="spark-count">0</span>
      </div>
      <div class="hud-wave">
        <span class="cap">Волна</span>
        <span id="wave-count">1 / 10</span>
      </div>
      <div class="hud-right">
        <div class="lives" id="lives"></div>
        <button class="icon-btn" id="btn-dev-game" aria-label="dev" hidden>&#9881;</button>
        <button class="icon-btn" id="btn-sound" aria-label="звук"></button>
        <button class="icon-btn" id="btn-pause" aria-label="пауза"></button>
      </div>
    </div>

    <div class="field-wrap" id="field-wrap">
      <canvas id="field"></canvas>
      <div id="unit-menu" class="unit-menu hidden"></div>
      <div id="wave-banner" class="wave-banner hidden">
        <span id="wave-banner-text"></span>
        <button class="btn tiny" id="btn-early">Начать раньше</button>
      </div>
      <div id="toast" class="toast hidden"></div>
      <div id="dev-panel" class="dev-panel hidden">
        <button data-dev="sparks">+1000 искр</button>
        <button data-dev="kill">Убить всех</button>
        <button data-dev="wave">Волна дальше</button>
        <button data-dev="win">Пройти уровень</button>
        <button data-dev="immortal" id="dev-immortal">Бессмертие: вкл</button>
      </div>
    </div>

    <div class="dock" id="dock"></div>
  </section>

</div>

<!-- Оверлей: пауза -->
<div id="overlay-pause" class="overlay hidden">
  <div class="panel">
    <h2>Пауза</h2>
    <button class="btn primary" data-act="resume">Продолжить</button>
    <button class="btn" data-act="restart">Начать заново</button>
    <button class="btn ghost" data-act="menu">Выйти в меню</button>
  </div>
</div>

<!-- Оверлей: результат уровня -->
<div id="overlay-result" class="overlay hidden">
  <div class="panel">
    <h2 id="result-title">Уровень пройден</h2>
    <div class="stars" id="result-stars"></div>
    <div class="result-stats" id="result-stats"></div>
    <div class="row">
      <button class="btn primary" id="btn-result-next" data-act="next">Дальше</button>
      <button class="btn" data-act="retry">Ещё раз</button>
    </div>
    <button class="btn ghost small" data-act="share">Поделиться результатом</button>
    <button class="btn ghost small" data-act="menu">В меню</button>
  </div>
</div>

<!-- Оверлей: обучение -->
<div id="overlay-tutorial" class="overlay hidden tutorial">
  <div class="panel">
    <span class="cap" id="tut-step">Шаг 1 из 3</span>
    <h2 id="tut-title"></h2>
    <p id="tut-text"></p>
    <button class="btn primary" id="tut-next">Дальше</button>
    <button class="btn ghost small" id="tut-skip">Пропустить</button>
  </div>
</div>

<script src="js/storage.js?v=16"></script>
<script src="js/telegram.js?v=16"></script>
<script src="js/sound.js?v=16"></script>
<script src="js/grid.js?v=16"></script>
<script src="js/units.js?v=16"></script>
<script src="js/enemies.js?v=16"></script>
<script src="js/waves.js?v=16"></script>
<script src="js/ui.js?v=16"></script>
<script src="js/game.js?v=16"></script>
<script src="js/main.js?v=16"></script>
</body>
</html>
